  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 border-box; display: flex; align-items: center; justify-content: center; background: #ffffff; padding: 0; font-family: 'Source Sans 3', system-ui, -apple-system, sans-serif;\">\n  <div style=\"position: relative; width: 100%; max-width: 920px;\">\n    <svg viewBox=\"0 0 920 1110\" style=\"display: block; width: 100%; height: auto; color: {{ landColorVal }}; overflow: hidden;\">\n      <g ref=\"{{ setSubtleRef }}\"><\u002Fg>\n      <g ref=\"{{ setLandRef }}\" fill=\"currentColor\"><\u002Fg>\n    <\u002Fsvg>\n    <div style=\"position: absolute; inset: 0;\">\n      <sc-for list=\"{{ pins }}\" as=\"p\" hint-placeholder-count=\"0\">\n        <div style=\"{{ p.wrapStyle }}\">\n          <sc-if value=\"{{ p.ring1Style }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"{{ p.ring1Style }}\"><\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ p.ring2Style }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"{{ p.ring2Style }}\"><\u002Fspan>\n          <\u002Fsc-if>\n          <span style=\"{{ p.dotStyle }}\"><\u002Fspan>\n          <sc-if value=\"{{ showLabels }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"{{ p.labelStyle }}\">{{ p.name }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: &quot;100%&quot; },\n  &quot;accentColor&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#ffffff&quot;, &quot;tsType&quot;: &quot;string&quot; },\n  &quot;landColor&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#a2a2a2&quot;, &quot;tsType&quot;: &quot;string&quot; },\n  &quot;pulseStyle&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;both&quot;, &quot;radar&quot;, &quot;heartbeat&quot;, &quot;none&quot;], &quot;default&quot;: &quot;none&quot;, &quot;tsType&quot;: &quot;string&quot; },\n  &quot;showLabels&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { pts: [] };\n\n  componentDidMount() { this.build(); }\n\n  loadScript(src) {\n    return new Promise((res, rej) => {\n      if ([...document.scripts].some(s => s.src === src)) {\n        if (this._loaded && this._loaded[src]) return res();\n        // wait a tick for an in-flight load\n        const check = () => (window.d3 && window.topojson) ? res() : setTimeout(check, 60);\n        return check();\n      }\n      const s = document.createElement('script');\n      s.src = src;\n      s.onload = () => { (this._loaded = this._loaded || {})[src] = true; res(); };\n      s.onerror = rej;\n      document.head.appendChild(s);\n    });\n  }\n\n  async build() {\n    const CITIES = [\n      { name: 'Tijuana',    lon: -117.04, lat: 32.53, labelPos: 'right' },\n      { name: 'Cd. Juárez', lon: -106.49, lat: 31.69, labelPos: 'right' },\n      { name: 'Chihuahua',  lon: -106.07, lat: 28.63, labelPos: 'right' },\n      { name: 'Monterrey',  lon: -100.31, lat: 25.69, labelPos: 'right' },\n      { name: 'Guadalajara',lon: -103.35, lat: 20.66, labelPos: 'left' },\n      { name: 'CDMX',       lon:  -99.13, lat: 19.43, labelPos: 'right', big: true },\n      { name: 'Guatemala',  lon:  -90.51, lat: 14.63, labelPos: 'right' },\n      { name: 'Costa Rica', lon:  -84.09, lat:  9.93, labelPos: 'left' },\n      { name: 'Panamá',     lon:  -79.52, lat:  8.98, labelPos: 'right' },\n    ];\n    const NAMES = new Set([\n      'Mexico','Guatemala','Belize','Honduras','El Salvador','Nicaragua',\n      'Costa Rica','Panama'\n    ]);\n    try {\n      const R = (window.__resources) || {};\n      await this.loadScript(R.d3 || 'https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js');\n      await this.loadScript(R.topojson || 'https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js');\n      const world = await (await fetch(R.worldAtlas || 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json')).json();\n      const geoms = world.objects.countries.geometries\n        .filter(g => NAMES.has(g.properties && g.properties.name));\n      const merged = window.topojson.merge(world, geoms);\n      const mergedAll = window.topojson.merge(world, world.objects.countries.geometries);\n\n      const W = 920, H = 1110, pad = 8;\n      const proj = window.d3.geoMercator();\n      const path = window.d3.geoPath(proj);\n      const bbox = { type: 'Polygon', coordinates: [[[-119, 42], [-72, 42], [-72, -9], [-119, -9], [-119, 42]]] };\n      proj.fitExtent([[pad, pad], [W - pad, H - pad]], bbox);\n\n      const subtle = this.props.contextColor ?? '#dcdcdc';\n      if (this.subtleEl) this.subtleEl.innerHTML = `<path fill=\"${subtle}\" d=\"${path(mergedAll)}\"><\u002Fpath>`;\n      if (this.landEl) this.landEl.innerHTML = `<path d=\"${path(merged)}\" stroke=\"#ffffff\" stroke-width=\"0.8\" stroke-linejoin=\"round\"><\u002Fpath>`;\n\n      const pts = CITIES.map(c => {\n        const xy = proj([c.lon, c.lat]);\n        return { name: c.name, big: !!c.big, labelPos: c.labelPos, x: xy[0], y: xy[1] };\n      });\n      this.setState({ pts });\n    } catch (e) {\n      console.error('LATAM map build failed:', e);\n    }\n  }\n\n  renderVals() {\n    const W = 920, H = 1110;\n    const accent = this.props.accentColor ?? '#ffffff';\n    const landColorVal = this.props.landColor ?? '#a2a2a2';\n    const pulseStyle = this.props.pulseStyle ?? 'none';\n    const showLabels = this.props.showLabels ?? false;\n    const wantRings = pulseStyle === 'both' || pulseStyle === 'radar';\n    const wantBeat = pulseStyle === 'both' || pulseStyle === 'heartbeat';\n\n    const pins = (this.state.pts || []).map((p, i) => {\n      const size = 12;\n      const delay = +(((i * 0.43) % 2.1)).toFixed(2);\n      const labelColor = '#2c2824';\n\n      const wrapStyle = {\n        position: 'absolute',\n        left: (p.x / W * 100) + '%',\n        top: (p.y / H * 100) + '%',\n        width: 0, height: 0,\n        opacity: 1,\n      };\n      const dotStyle = {\n        position: 'absolute', left: 0, top: 0,\n        width: size + 'px', height: size + 'px',\n        borderRadius: '50%', background: accent,\n        boxShadow: '0 1px 3px rgba(0,0,0,0.28)',\n        transform: 'translate(-50%, -50%)',\n        zIndex: 3,\n        animation: wantBeat ? `latam-beat 1.7s ease-in-out ${delay}s infinite` : 'none',\n      };\n      const ringBase = {\n        position: 'absolute', left: 0, top: 0,\n        width: size + 'px', height: size + 'px',\n        borderRadius: '50%', background: accent,\n        transform: 'translate(-50%, -50%)',\n        pointerEvents: 'none', zIndex: 1,\n      };\n      const ring1Style = wantRings ? { ...ringBase, animation: `latam-pulse 2.9s ease-out ${delay}s infinite` } : undefined;\n      const ring2Style = wantRings ? { ...ringBase, opacity: 0.7, animation: `latam-pulse 2.9s ease-out ${(delay + 1.45).toFixed(2)}s infinite` } : undefined;\n\n      const labelBase = {\n        position: 'absolute',\n        fontFamily: \"'Source Sans 3', system-ui, sans-serif\",\n        fontSize: p.big ? '22px' : '18px',\n        fontWeight: p.big ? 700 : 400,\n        color: labelColor,\n        whiteSpace: 'nowrap',\n        letterSpacing: '0.005em',\n        zIndex: 4,\n      };\n      let labelStyle;\n      if (p.labelPos === 'below') {\n        labelStyle = { ...labelBase, left: 0, top: (size / 2 + 11) + 'px', transform: 'translateX(-50%)' };\n      } else if (p.labelPos === 'left') {\n        labelStyle = { ...labelBase, right: (size / 2 + 13) + 'px', top: 0, transform: 'translateY(-50%)', textAlign: 'right' };\n      } else {\n        labelStyle = { ...labelBase, left: (size / 2 + 13) + 'px', top: 0, transform: 'translateY(-50%)' };\n      }\n\n      return { name: p.name, wrapStyle, dotStyle, ring1Style, ring2Style, labelStyle };\n    });\n\n    return {\n      pins,\n      landColorVal,\n      showLabels,\n      setLandRef: (el) => { this.landEl = el; },\n      setSubtleRef: (el) => { this.subtleEl = el; },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
